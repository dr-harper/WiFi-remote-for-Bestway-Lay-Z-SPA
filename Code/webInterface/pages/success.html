{% extends "../layout.html" %}

{% block header_headline_title %}
<span data-i18n="title_success_header">Success</span>
{% endblock %}

{% block top_navigation %}
{% run use_component("topNavigation", "") %}
{% endblock %}

{% block content %}
<section>
  <div class="card" style="text-align:center;padding:2rem 1rem">
    <div style="font-size:3rem;color:var(--good);margin-bottom:.5rem">✓</div>
    <h2 style="margin:0 0 .5rem" data-i18n="success_title">All done</h2>
    <p data-i18n="success_message">The operation completed successfully.</p>
  </div>
</section>

<section>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.5rem">
    <a class="btn btn-primary" href="/" data-i18n="success_btn_home">Home</a>
    <a class="btn" href="/upload.html" data-i18n="success_btn_upload">Upload a file</a>
    <a class="btn" href="/remove.html" data-i18n="success_btn_remove">Remove a file</a>
  </div>
</section>
{% endblock %}
